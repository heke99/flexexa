# Linux loopback sidecar protocol fixture; no hosted deployment or external listener.
services:
  collector:
    image: otel/opentelemetry-collector:0.160.0@sha256:e495787f07dbe432ce763ebaf5bc3d113850e9eee2250ade7a3da6a882d0d69a
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    network_mode: host
    command: [--config=/etc/otelcol/config.yaml]
    environment:
      FLEXEXA_OTEL_RECEIVER_PORT: ${FLEXEXA_OTEL_RECEIVER_PORT:?isolated receiver port required}
      FLEXEXA_OTEL_HEALTH_PORT: ${FLEXEXA_OTEL_HEALTH_PORT:?isolated health port required}
      FLEXEXA_OTEL_METRICS_PORT: ${FLEXEXA_OTEL_METRICS_PORT:?isolated metrics port required}
      FLEXEXA_OTEL_EXPORT_PORT: ${FLEXEXA_OTEL_EXPORT_PORT:?isolated export port required}
    volumes:
      - ./config.yaml:/etc/otelcol/config.yaml:ro
