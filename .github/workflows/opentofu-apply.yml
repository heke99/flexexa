name: OpenTofu AWS apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_DEV to apply the reviewed dev foundation."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: flexexa-opentofu-dev-apply
  cancel-in-progress: false

jobs:
  apply-dev:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'APPLY_DEV'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'

      - name: Test fail-closed development plan gate
        run: node --test infra/opentofu/scripts/verify-dev-plan.test.mjs

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Configure main-only AWS apply credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::938095765653:role/flexexa-github-apply-dev
          aws-region: eu-north-1
          allowed-account-ids: 938095765653
          role-session-name: flexexa-main-apply-${{ github.run_id }}
          retry-max-attempts: 3
          action-timeout-s: 10

      - name: Check formatting
        run: tofu fmt -check -recursive infra/opentofu

      - name: Initialize dev backend
        working-directory: infra/opentofu/environments/dev
        run: |
          cat > /tmp/flexexa-backend.hcl <<'EOF'
          bucket = "flexexa-tofu-state-938095765653"
          key    = "flexexa/dev/foundation.tfstate"
          region = "eu-north-1"
          EOF
          tofu init -input=false -backend-config=/tmp/flexexa-backend.hcl

      - name: Validate dev configuration
        working-directory: infra/opentofu/environments/dev
        run: tofu validate

      - name: Create first-foundation apply plan
        working-directory: infra/opentofu/environments/dev
        run: tofu plan -input=false -lock-timeout=5m -no-color -out=tfplan

      - name: Reject unreviewed changes before apply
        working-directory: infra/opentofu/environments/dev
        run: |
          trap 'rm -f /tmp/flexexa-dev-plan.json' EXIT
          tofu show -json tfplan > /tmp/flexexa-dev-plan.json
          node ../../scripts/verify-dev-plan.mjs /tmp/flexexa-dev-plan.json pre-apply-safety.json
          tofu show -no-color tfplan > pre-apply-plan.txt

      - name: Apply the validated saved plan
        working-directory: infra/opentofu/environments/dev
        run: tofu apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Verify zero drift after apply
        working-directory: infra/opentofu/environments/dev
        shell: bash
        run: |
          set +e
          tofu plan -input=false -lock-timeout=5m -detailed-exitcode -no-color -out=post-apply.tfplan > post-apply-plan.txt
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            cat post-apply-plan.txt
            echo "Post-apply verification failed or found drift." >&2
            exit "$code"
          fi
          trap 'rm -f /tmp/flexexa-post-apply.json' EXIT
          tofu show -json post-apply.tfplan > /tmp/flexexa-post-apply.json
          node ../../scripts/verify-dev-plan.mjs /tmp/flexexa-post-apply.json post-apply-safety.json
          echo "Post-apply verification: zero drift and reviewed dev scope."

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flexexa-opentofu-dev-apply-evidence
          path: |
            infra/opentofu/environments/dev/pre-apply-plan.txt
            infra/opentofu/environments/dev/pre-apply-safety.json
            infra/opentofu/environments/dev/post-apply-plan.txt
            infra/opentofu/environments/dev/post-apply-safety.json
          if-no-files-found: warn
          retention-days: 7
