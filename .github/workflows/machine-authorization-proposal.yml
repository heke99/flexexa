name: Isolated machine authorization proposal
on:
  pull_request:
    branches: [main, phase/0-foundation]
permissions:
  contents: read
concurrency:
  group: machine-proposal-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.117.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check tracked local configuration
        run: |
          supabase --version
          test -f supabase/config.toml
          test -n "$(find supabase/migrations -name '*_phase0_authorization_invariants.sql')"
          test -f supabase/migrations/20260909111942_phase0_customer_site_asset_core.sql
      - name: Generate isolated candidate with Supabase CLI
        run: |
          supabase migration new phase0_machine_authorization
          migration="$(find supabase/migrations -name '*_phase0_machine_authorization.sql')"
          test -n "$migration"
          cp supabase/proposals/phase0_machine_authorization.sql "$migration"
          cp supabase/proposal-tests/008_machine_authorization.test.sql supabase/tests/database/
      - name: Start isolated Supabase
        run: supabase start
      - name: Clean migration replay
        run: supabase db reset --local
      - name: Real PostgreSQL RLS and authorization tests
        run: supabase test db
      - name: Cross-language contracts and real concurrent RPC verification
        env:
          ALLOW_ISOLATED_DB_TESTS: '1'
          PGHOST: '127.0.0.1'
          PGPORT: '54322'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          python3 scripts/database/verify-core.py
          python3 scripts/database/verify-connect.py
          python3 scripts/database/verify-provider-accounts.py
          node --experimental-strip-types scripts/database/verify-rpc-transport.mjs
          node --experimental-strip-types scripts/database/verify-machine-authorization.mjs
      - name: Retain exact migration replay inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: machine-authorization-replay-inputs
          path: supabase/migrations/*.sql
          if-no-files-found: error
          retention-days: 7
      - name: Retain tracked source snapshot for review
        if: always()
        run: git archive --format=tar HEAD > /tmp/flexexa-reviewed-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: machine-authorization-reviewed-source
          path: /tmp/flexexa-reviewed-source.tar
          retention-days: 1
      - name: Stop local services
        if: always()
        run: supabase stop --no-backup
