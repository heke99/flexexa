name: Charging portal web verification
on:
  pull_request:
    branches: ['feat/live-prices-auth-20261105']
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Install frozen dependencies
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify portal API boundary and production bundle
        run: |
          pnpm --filter @flexexa/web test
          pnpm --filter @flexexa/web lint
          pnpm --filter @flexexa/web typecheck
          pnpm --filter @flexexa/web build
