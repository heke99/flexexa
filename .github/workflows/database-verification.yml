name: Supabase replay and authorization tests
on:
  pull_request:
    branches: [main, phase/0-foundation]
permissions:
  contents: read
concurrency:
  group: db-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.117.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check tracked local configuration
        run: |
          supabase --version
          test -f supabase/config.toml
          test -n "$(find supabase/migrations -name '*_phase0_authorization_invariants.sql')"
          test -f supabase/migrations/20260909111942_phase0_customer_site_asset_core.sql
      - name: Start isolated Supabase
        run: supabase start
      - name: Build identity runtime from tracked source
        run: |
          docker build --pull -f apps/identity-service/Dockerfile -t flexexa-identity:ci .
          docker image inspect --format '{{.Id}}' flexexa-identity:ci
      - name: Clean migration replay
        run: supabase db reset --local
      - name: Capture clean application schema before test fixtures
        env:
          PGHOST: '127.0.0.1'
          PGPORT: '54322'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
        run: node scripts/database/capture-schema-catalog.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flexexa-clean-schema-catalog
          path: .flexexa/index/schema-catalog.json
          if-no-files-found: error
          retention-days: 7
      - name: Real PostgreSQL RLS and authorization tests
        run: supabase test db
      - name: Cross-language contracts and real concurrent RPC verification
        env:
          ALLOW_ISOLATED_DB_TESTS: '1'
          PGHOST: '127.0.0.1'
          PGPORT: '54322'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          python3 scripts/database/verify-core.py
          python3 scripts/database/verify-connect.py
          python3 scripts/database/verify-provider-accounts.py
          node --experimental-strip-types scripts/database/verify-rpc-transport.mjs
          node --experimental-strip-types scripts/database/verify-machine-authorization.mjs
          node --experimental-strip-types scripts/database/verify-identity-administration.mjs
          node --experimental-strip-types scripts/database/verify-auth-provisioning.mjs
          IDENTITY_CONTAINER_IMAGE=flexexa-identity:ci node --experimental-strip-types scripts/database/verify-auth-provisioning.mjs
      - name: Scan the tested container for high and critical vulnerabilities
        run: |
          mkdir -p /tmp/flexexa-image-input /tmp/flexexa-image-report
          docker save flexexa-identity:ci -o /tmp/flexexa-image-input/identity.tar
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges \
            -e TRIVY_CACHE_DIR=/tmp/trivy-cache \
            -v /tmp/flexexa-image-input:/images:ro -v /tmp/flexexa-image-report:/reports \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --input /images/identity.tar \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /reports/trivy.json
      - name: Retain container vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flexexa-identity-container-scan
          path: /tmp/flexexa-image-report/trivy.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain exact migration replay inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flexexa-db-replay-inputs
          path: supabase/migrations/*.sql
          if-no-files-found: error
          retention-days: 7
      - name: Retain tracked source snapshot for review
        if: always()
        run: git archive --format=tar HEAD > /tmp/flexexa-reviewed-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flexexa-reviewed-source
          path: /tmp/flexexa-reviewed-source.tar
          retention-days: 1
      - name: Stop local services
        if: always()
        run: supabase stop --no-backup
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned package manager and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm install --frozen-lockfile
      - name: Verify application scope (database and infrastructure are separate gates)
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify:affected -- --base "$IMPACT_BASE" --application-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flexexa-application-verification
          path: .flexexa/index/*.json
          retention-days: 7
