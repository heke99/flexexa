name: Publish reviewed lock blob (temporary)
on:
  pull_request:
    branches: [phase/0-foundation]
permissions:
  contents: read
jobs:
  publish-reviewed-blob:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/phase0-canonical-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      # No checkout, dependency installation or execution of pull-request files.
      # This job only publishes one reviewed, content-addressed blob. It cannot
      # commit it or move refs; the review operation performs that separately.
      - name: Publish exact independently reviewed lock bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/heke99/flexexa/actions/artifacts/10103058111/zip > /tmp/reviewed-lock.zip
          python - <<'PY'
          import base64, hashlib, json, pathlib, zipfile
          archive=pathlib.Path('/tmp/reviewed-lock.zip').read_bytes()
          assert hashlib.sha256(archive).hexdigest() == '11b7cfcf07400ea1a67f94fdd58f612847c5a3522a130a25271f2538b3dd3e3e'
          with zipfile.ZipFile('/tmp/reviewed-lock.zip') as z:
              assert z.namelist() == ['pnpm-lock.yaml']
              assert z.getinfo('pnpm-lock.yaml').file_size == 138989
              data=z.read('pnpm-lock.yaml')
          assert hashlib.sha256(data).hexdigest() == '00e0193c88925b58ce9d69192c925c7ff6989f05c78f51b6cca6783fced0de5b'
          pathlib.Path('/tmp/reviewed-blob.json').write_text(json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}))
          PY
          SHA=$(gh api --method POST repos/heke99/flexexa/git/blobs --input /tmp/reviewed-blob.json --jq .sha)
          test "$SHA" = f68f97c266c0c785251aa7a4f9a7b0b2cddf1bbb
          printf 'Reviewed lock Git blob: %s\n' "$SHA"
