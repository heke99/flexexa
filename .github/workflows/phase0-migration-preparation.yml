name: Phase 0 migration preparation
on:
  push:
    branches: [phase/0-database-performance]
    paths: [.github/workflows/phase0-migration-preparation.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.117.0
      - name: Generate candidate filename with the actual pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = heke99/flexexa
          test "$GITHUB_REF" = refs/heads/phase/0-database-performance
          supabase --version
          supabase migration new --help
          supabase migration new phase0_database_performance
          mkdir -p "$RUNNER_TEMP/migration-preparation"
          mapfile -t candidates < <(find supabase/migrations -name '*_phase0_database_performance.sql')
          test "${#candidates[@]}" -eq 1
          cp "${candidates[0]}" "$RUNNER_TEMP/migration-preparation/"
          printf 'Generated by Supabase CLI 2.117.0; source %s; no database connection or migration apply.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/migration-preparation/provenance.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flexexa-migration-preparation
          path: ${{ runner.temp }}/migration-preparation/
          if-no-files-found: error
          retention-days: 1
