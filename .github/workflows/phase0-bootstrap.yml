name: Flexexa quality verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm install --frozen-lockfile
      - name: Application and impact verification
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify:affected -- --application-only --base "$IMPACT_BASE"
      - name: Upload impact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexexa-impact-index
          path: .flexexa/index/*.json
          if-no-files-found: error
