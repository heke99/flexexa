name: OpenTofu AWS plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/opentofu/**"
      - ".github/workflows/opentofu-plan.yml"

permissions:
  contents: read
  id-token: write

jobs:
  plan-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Inspect non-secret GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          export OIDC_TOKEN="$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["value"])' <<<"$RESPONSE")"
          python - <<'PY'
          import base64, json, os
          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload.encode()))
          allow = ["iss","aud","sub","repository","repository_owner","ref","event_name","job_workflow_ref"]
          print(json.dumps({k: claims.get(k) for k in allow}, sort_keys=True))
          PY
          unset OIDC_TOKEN RESPONSE

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::938095765653:role/flexexa-github-plan
          aws-region: eu-north-1
          allowed-account-ids: 938095765653
          role-session-name: flexexa-pr-plan-${{ github.run_id }}
          retry-max-attempts: 3
          action-timeout-s: 60

      - name: Check formatting
        run: tofu fmt -check -recursive infra/opentofu

      - name: Initialize dev backend
        working-directory: infra/opentofu/environments/dev
        run: |
          cat > /tmp/flexexa-backend.hcl <<'EOF'
          bucket = "flexexa-tofu-state-938095765653"
          key    = "flexexa/dev/foundation.tfstate"
          region = "eu-north-1"
          EOF
          tofu init -input=false -backend-config=/tmp/flexexa-backend.hcl

      - name: Validate dev configuration
        working-directory: infra/opentofu/environments/dev
        run: tofu validate

      - name: Plan dev foundation
        working-directory: infra/opentofu/environments/dev
        run: tofu plan -input=false -lock=false -no-color -out=tfplan

      - name: Render plan
        working-directory: infra/opentofu/environments/dev
        run: tofu show -no-color tfplan > tfplan.txt

      - name: Upload plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: flexexa-opentofu-dev-plan
          path: infra/opentofu/environments/dev/tfplan.txt
          if-no-files-found: error
