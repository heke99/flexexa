name: Isolated Connect registry proposal
on:
  pull_request:
    branches: [phase/0-foundation]
permissions:
  contents: read
jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.117.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate isolated migration with CLI
        run: |
          supabase migration new --help
          supabase migration new phase0_connect_registry
          target="$(find supabase/migrations -name '*_phase0_connect_registry.sql')"
          test -n "$target"
          cp supabase/proposals/phase0_connect_registry.sql "$target"
      - run: supabase start && supabase db reset --local && supabase test db
      - name: Verify prior real concurrency and contracts
        env:
          ALLOW_ISOLATED_DB_TESTS: '1'
          PGHOST: '127.0.0.1'
          PGPORT: '54322'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          python3 scripts/database/verify-core.py
          python3 scripts/database/verify-connect.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flexexa-connect-tested-migration
          path: supabase/migrations/*_phase0_connect_registry.sql
          if-no-files-found: error
      - if: always()
        run: supabase stop --no-backup
