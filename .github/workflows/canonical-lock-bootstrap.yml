name: Canonical dependency resolution (temporary)
on:
  pull_request:
    branches: [phase/0-foundation]
permissions:
  contents: read
jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/phase0-canonical-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve the explicitly changed pinned manifests
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm install --no-frozen-lockfile
      - name: Retain generated lock for reviewed promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flexexa-canonical-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Lint, typecheck, real tests and build
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify:affected -- --base "$IMPACT_BASE" --application-only
